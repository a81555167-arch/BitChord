name: Spotify Cache Branch Build

on:
  push:
    branches:
      - feature/spotify-library-cache
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools,platforms;android-37'

      - name: Create local properties
        run: |
          echo "LASTFM_API_KEY=" > local.properties
          echo "LASTFM_SECRET=" >> local.properties

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Compile production debug Kotlin
        run: ./gradlew :app:compileProdDebugKotlin
