name: Spotify Cache Branch Build

on:
  push:
    branches:
      - feature/spotify-library-cache
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spotify-cache-branch-build-final
  cancel-in-progress: true

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 17 preview platform
        run: |
          sdkmanager --channel=3 "platforms;android-37.0"
          ln -sfn "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"

      - name: Create local properties
        run: |
          echo "LASTFM_API_KEY=" > local.properties
          echo "LASTFM_SECRET=" >> local.properties

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Compile production debug Kotlin
        run: ./gradlew :app:compileProdDebugKotlin --stacktrace

      - name: Assemble production debug APK
        run: ./gradlew :app:assembleProdDebug --stacktrace
