name: MyBit - Spotify Sync - APK Build

permissions:
  contents: write

on:
  push:
    branches: [main, feature/spotify-library-cache, feature/audio-sources-newpipe-soundcloud]
  workflow_dispatch:

jobs:
  build-installable-debug:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup local.properties
      env:
        LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
      run: |
        echo "LASTFM_API_KEY=$LASTFM_API_KEY" > local.properties
        echo "LASTFM_SECRET=$LASTFM_SECRET" >> local.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build installable Prod Debug APK
      run: ./gradlew assembleProdDebug

    - name: Name APK for easy identification
      run: |
        APK_PATH="$(find app/build/outputs/apk/prod/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"
        test -n "$APK_PATH"
        cp "$APK_PATH" app/build/outputs/apk/prod/debug/MyBit-Spotify-Bidirectional-Sync.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MyBit-Spotify-Bidirectional-Sync-APK
        path: app/build/outputs/apk/prod/debug/MyBit-Spotify-Bidirectional-Sync.apk

    - name: Publish direct APK download
      uses: softprops/action-gh-release@v2
      with:
        tag_name: mybit-test-latest
        target_commitish: feature/spotify-library-cache
        name: MyBit test build (latest)
        prerelease: true
        make_latest: false
        overwrite_files: true
        files: app/build/outputs/apk/prod/debug/MyBit-Spotify-Bidirectional-Sync.apk
